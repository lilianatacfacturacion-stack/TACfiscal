<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>TacFiscal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tacfiscal.css">

</head>
<body>
<div id="app">
  <div id="screens">
    <div class="screen active" id="s-dashboard"></div>
    <div class="screen" id="s-clientes"></div>
    <div class="screen" id="s-ficha"></div>
    <div class="screen" id="s-campana"></div>
    <div class="screen" id="s-renta"></div>
    <div class="screen" id="s-renta-ficha"></div>
    <div class="screen" id="s-renta-cuestionario"></div>
    <div class="screen" id="s-config"></div>
  </div>
  <nav id="bottom-nav">
    <div class="nav-item active" data-screen="dashboard"><span class="nav-icon">🏠</span><span class="nav-label">Inicio</span></div>
    <div class="nav-item" data-screen="clientes"><span class="nav-icon">👥</span><span class="nav-label">Clientes</span></div>
    <div class="nav-item" data-screen="campana"><span class="nav-icon">📊</span><span class="nav-label">Campaña</span></div>
    <div class="nav-item" data-screen="renta"><span class="nav-icon">📝</span><span class="nav-label">Renta</span></div>
    <div class="nav-item" data-screen="config"><span class="nav-icon">⚙️</span><span class="nav-label">Config</span></div>
  </nav>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet"><div class="modal-handle"></div><div id="modal-body"></div></div>
</div>
<input type="file" id="file-input" accept=".pdf,image/*">
<div id="toast"></div>

<script src="tacfiscal.js"></script>
</body>
</html>
